[package]
name = "shannon-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shannon Code desktop application (Tauri)"
license.workspace = true

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-shell", "dep:tauri-plugin-updater", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-window-state"]

[dependencies]
shannon-core = { path = "../shannon-core" }
shannon-types = { path = "../shannon-types" }
shannon-tools = { path = "../shannon-tools" }
shannon-mcp = { path = "../shannon-mcp" }
shannon-skills = { path = "../shannon-skills" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tempfile = "3"
base64 = "0.22"
dirs = "5"

tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[package.metadata.dist]
dist = false

[package.metadata.tauri]
# Tauri build configuration — these settings control the native window
productName = "Shannon Code"
identifier = "com.shannon-code.desktop"
window = { title = "Shannon Code", width = 1200, height = 800, minWidth = 800, minHeight = 600 }
